name: Full Automation Pipeline (Sync & Deliver)

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动执行
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'Scripts/**'
      - 'scripts/**'
      - 'Profiles/**'
      - 'rule/**'
      - 'rewrite/**'
      - '.github/workflows/**'
  workflow_dispatch:
  repository_dispatch:
    # 同时监听 Telegram 的全量同步与动态规则管理
    types: [tg_sync, manage_rule]

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 运行核心总控：智能识别是“全量同步”还是“Telegram 动态规则增删”
      - name: Run Master Controller Engine
        id: run_engine
        run: |
          # 自动定位 scripts 脚本目录 (兼容大小写)
          CTL_PATH="scripts/controller.py"
          [ ! -f "$CTL_PATH" ] && CTL_PATH="Scripts/controller.py"
          
          EVENT_ACTION="${{ github.event.action }}"
          OP_ACTION="${{ github.event.client_payload.action }}"
          PAYLOAD="${{ github.event.client_payload.payload }}"
          
          echo "Current Event Action: $EVENT_ACTION"

          # 模式 A: 来自 Telegram 的规则动态管理 (/rule add 或 /rule del)
          if [ "$EVENT_ACTION" = "manage_rule" ]; then
            echo "⚡ 正在执行 Telegram 动态规则运维任务: $OP_ACTION"
            OUTPUT=$(python3 "$CTL_PATH" --action "$OP_ACTION" --payload "$PAYLOAD" || true)
            echo "IS_MANAGE_RULE=true" >> $GITHUB_ENV

          # 模式 B: 全量同步 (定时任务 / git push / /sync 指令)
          else
            echo "🚀 正在执行全量抓取与双端资产编译..."
            
            # 若仍保留原有的上游抓取脚本，先执行抓取；若无则直接执行全量构建
            SYNC_PATH="Scripts/sync_all.py"
            [ ! -f "$SYNC_PATH" ] && SYNC_PATH="scripts/sync_all.py"
            if [ -f "$SYNC_PATH" ]; then
              python3 "$SYNC_PATH" || true
            fi

            # 调用 controller 重新生成 Stash Override、刷新 README 并强制固化透明探针
            OUTPUT=$(python3 "$CTL_PATH" --action build-all || true)
            echo "IS_MANAGE_RULE=false" >> $GITHUB_ENV
          fi

          # 记录输出供 Telegram 发送执行报告
          echo "REPORT<<EOF" >> $GITHUB_ENV
          echo "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 2. 仓库全量交付：纳入 README.md 监控，杜绝误杀探针
      - name: Commit & Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 核心修复：必须加入 README.md，防止探针变动被判定为空变动而 reset
          CORE_CHANGES=$(git status --porcelain rule/ rewrite/ Profiles/ README.md QuantumultX.conf Stash.yaml)

          if [ -n "$CORE_CHANGES" ]; then
            echo "💡 检测到实质变动，执行版本交付..."
            git add -A
            
            if [ "$IS_MANAGE_RULE" = "true" ]; then
              git commit -m "chore(rule): [Telegram Bot] 动态更新分流规则"
            else
              git commit -m "chore(auto): sync upstream rules and update subscription profiles"
            fi
            
            git pull --rebase origin main
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ 资产无实质变动，保持仓库干净..."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # 3. Telegram 结果精准回执
      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          HAS_CHANGES: ${{ steps.commit_step.outputs.has_changes }}
          IS_MANAGE: ${{ env.IS_MANAGE_RULE }}
          REPORT: ${{ env.REPORT }}
        run: |
          python3 - << 'PY_TG'
          import os, json, urllib.request
          from datetime import datetime, timezone, timedelta

          token = os.environ.get('TG_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TG_CHAT_ID', '').strip()
          status = os.environ.get('JOB_STATUS', '')
          has_changes = os.environ.get('HAS_CHANGES', '')
          is_manage = os.environ.get('IS_MANAGE', '')
          report = os.environ.get('REPORT', '').strip()

          if not token or not chat_id:
              print('ℹ️ 未检测到 TG_BOT_TOKEN 或 TG_CHAT_ID，跳过通知。')
              exit(0)

          tz = timezone(timedelta(hours=8))
          now_str = datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S')
          repo = os.environ.get('GITHUB_REPOSITORY', 'Mygodsss/wang47')

          if status == 'success':
              # 场景 1: Telegram 增删规则的回执
              if is_manage == 'true':
                  text = f"🤖 *Wang47 规则自动化运维回执*\n\n{report}\n\n*时间:* {now_str} (UTC+8)\n*状态:* 已编译并推送到仓库"
              # 场景 2: 全量构建且有更新
              elif has_changes == 'true':
                  text = f"🚀 *QX & Stash 自动同步完成*\n\n*状态:* 资产已全量刷新，README 探针已固化\n*时间:* {now_str} (UTC+8)\n*仓库:* [{repo}](https://github.com/{repo})"
              # 场景 3: 日常定时巡检无变动
              else:
                  text = f"ℹ️ *QX & Stash 日常巡检*\n\n*状态:* 规则无实质变动，订阅资产保持最新\n*时间:* {now_str} (UTC+8)"
          else:
              text = f"❌ *流水线运行异常*\n\n*报错详情:*\n```\n{report[:300]}\n```\n*排查链接:* https://github.com/{repo}/actions"

          url = f'https://api.telegram.org/bot{token}/sendMessage'
          payload = {
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'Markdown',
              'disable_web_page_preview': True
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('🎉 Telegram 推送成功')
          except Exception as e:
              print(f'❌ Telegram 发送异常: {e}')
              raise e
          PY_TG

name: Sync Upstream Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sync Script
        run: |
          if [ -f "scripts/sync.py" ]; then
            python scripts/sync.py
          elif [ -f "Scripts/sync.py" ]; then
            python Scripts/sync.py
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add QuantumultX/Filter/Payment/ Stash/RuleSet/Payment/ QuantumultX/Filter/Google/ Stash/RuleSet/Google/ README.md
          if git diff --staged --quiet; then
            echo "无规则或自述文件变动，跳过推送"
          else
            git commit -m "chore: auto-sync rules and update README [skip ci]"
            git push
          fi

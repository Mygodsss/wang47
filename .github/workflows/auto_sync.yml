name: Full Automation Pipeline (Sync & Deliver)

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动执行
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'Scripts/**'
      - 'Profiles/**'
      - 'rule/**'
      - 'rewrite/**'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 运行核心总控：编译 QX、Stash 规则集、重装配置、刷新 README
      - name: Run Auto Sync Engine
        run: |
          python Scripts/sync_all.py

      # 2. 仓库全量交付：自动提交并推送到 GitHub 仓库
      - name: Commit & Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无文件变更"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(auto): sync rules, profiles and readme"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # 3. Telegram 结果报告
      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          HAS_CHANGES: ${{ steps.commit_step.outputs.has_changes }}
        run: |
          python3 - << 'PY_TG'
          import os, json, urllib.request
          from datetime import datetime, timezone, timedelta

          token = os.environ.get('TG_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TG_CHAT_ID', '').strip()
          status = os.environ.get('JOB_STATUS', '')
          has_changes = os.environ.get('HAS_CHANGES', '')

          if not token or not chat_id:
              print('ℹ️ 未检测到 TG_BOT_TOKEN 或 TG_CHAT_ID，跳过通知。')
              exit(0)

          tz = timezone(timedelta(hours=8))
          now_str = datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S')
          repo = os.environ.get('GITHUB_REPOSITORY', 'Mygodsss/wang47')

          if status == 'success':
              if has_changes == 'true':
                  text = f'🚀 *QX & Stash 自动同步完成*\n\n*状态:* 规则库已刷新，最新配置与自述文件已提交至仓库\n*时间:* {now_str} (UTC+8)\n*仓库:* [{repo}](https://github.com/{repo})'
              else:
                  text = f'ℹ️ *QX & Stash 日常巡检*\n\n*状态:* 规则无变动，仓库配置保持最新\n*时间:* {now_str} (UTC+8)'
          else:
              text = f'❌ *QX & Stash 流水线运行报错*\n\n*状态:* 构建失败，请排查 Actions 日志\n*链接:* https://github.com/{repo}/actions'

          url = f'https://api.telegram.org/bot{token}/sendMessage'
          payload = {
              'chat_id': chat_id,
              'text': text,
              'parse_mode': 'Markdown',
              'disable_web_page_preview': True
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('🎉 Telegram 推送成功:', resp.read().decode('utf-8'))
          except Exception as e:
              print(f'❌ Telegram 发送异常: {e}')
              raise e
          PY_TG

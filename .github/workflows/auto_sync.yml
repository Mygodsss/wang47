name: Full Automation Pipeline (Sync & Deliver)

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
    paths:
      - 'Scripts/**'
      - 'Profiles/**'
      - 'rule/**'
      - 'rewrite/**'
      - '.github/workflows/**'
  workflow_dispatch:
  repository_dispatch:
    types: [tg_sync, manage_rule]

concurrency:
  group: sync-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pyyaml

      - name: Run Engine
        id: run_engine
        run: |
          echo "🚀 正在执行全量抓取与双端资产编译..."
          SYNC_PATH="Scripts/sync_all.py"
          [ ! -f "$SYNC_PATH" ] && SYNC_PATH="scripts/sync_all.py"
          
          # 不加 || true，如遇语法错误立即抛出报警，拒绝假死
          python3 "$SYNC_PATH"

      - name: Commit & Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for target in rule rewrite Profiles Scripts scripts QuantumultX.conf Stash.yaml README.md; do
            if [ -e "$target" ]; then
              git add -A "$target"
            fi
          done

          CORE_CHANGES=$(git diff --cached --name-only)

          if [ -n "$CORE_CHANGES" ]; then
            echo "💡 检测到核心分流资产或配置实质变动，执行版本交付..."
            git commit -m "chore(auto): sync upstream rules and update subscription profiles [skip ci]"
            
            SUCCESS=false
            for i in 1 2 3; do
              echo "🔄 尝试推送到远程仓库 (第 $i 次)..."
              git pull --rebase -X theirs origin main || git rebase --abort || true
              if git push origin main; then
                SUCCESS=true
                break
              fi
              echo "⚠️ 远程分支存在竞争，等待 3 秒后重试..."
              sleep 3
            done

            if [ "$SUCCESS" = "true" ]; then
              echo "✅ 推送成功并完成交付！"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "❌ 连续 3 次推送均遭遇冲突失败"
              exit 1
            fi
          else
            echo "ℹ️ 上游规则与主配置无实质变动，保持仓库干净..."
            git reset --hard HEAD
            git clean -fd
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          HAS_CHANGES: ${{ steps.commit_step.outputs.has_changes }}
        run: |
          python3 - << 'PY_TG'
          import os, json, urllib.request
          from datetime import datetime, timezone, timedelta

          token = os.environ.get('TG_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TG_CHAT_ID', '').strip()
          status = os.environ.get('JOB_STATUS', '')
          has_changes = os.environ.get('HAS_CHANGES', '')

          if not token or not chat_id:
              exit(0)

          tz = timezone(timedelta(hours=8))
          now_str = datetime.now(tz).strftime('%Y-%m-%d %H:%M:%S')
          repo = os.environ.get('GITHUB_REPOSITORY', 'Mygodsss/wang47')

          if status == 'success':
              if has_changes == 'true':
                  text = f"🚀 *QX & Stash 自动同步完成*\n\n*状态:* 上游规则/主配置已刷新，最新订阅资产已交付仓库\n*时间:* {now_str} (UTC+8)\n*仓库:* [{repo}](https://github.com/{repo})"
              else:
                  text = f"ℹ️ *QX & Stash 日常巡检*\n\n*状态:* 上游规则无变动，双端订阅配置保持最新\n*时间:* {now_str} (UTC+8)"
          else:
              text = f"❌ *流水线运行报错*\n\n*排查链接:* https://github.com/{repo}/actions"

          url = f'https://api.telegram.org/bot{token}/sendMessage'
          payload = {'chat_id': chat_id, 'text': text, 'parse_mode': 'Markdown', 'disable_web_page_preview': True}
          req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(req)
          except Exception as e:
              print(f'推送失败: {e}')
          PY_TG

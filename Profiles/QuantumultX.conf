url-latency-benchmark=日本节点, server-tag-regex=(🇯🇵|日|JP|Japan), check-interval=600, tolerance=30, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
url-latency-benchmark=美国节点, server-tag-regex=(🇺🇸|美|US|States|American), check-interval=600, tolerance=40, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png


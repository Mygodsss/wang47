# ==========================================
# 2. 核心与主流节点池（自动测速优选 url-latency-benchmark）
# ==========================================

# 在正则里加入 (距离|套餐|到期|剩余|GB|重置) 进行彻底过滤
url-latency-benchmark = 自动选择, server-tag-regex=^(?!.*(?:官网|到期|剩余|GB|重置|traffic)).*(🇭🇰|港|HK|🇹🇼|台|TW|🇸🇬|新|SG|🇯🇵|日|JP|🇺🇸|美|US).*$, check-interval=300, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

#  AI-Core / bitsflow 专线测速池
url-latency-benchmark=bitsflow, server-tag-regex=(AI-Core|bitsflow-AI), check-interval=600, tolerance=20, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

# 3大主流核心地区（实时自动测速，优选最低延迟）
url-latency-benchmark=香港节点, server-tag-regex=(🇭🇰|港|HK|HongKong), check-interval=600, tolerance=30, alive-checking=false, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

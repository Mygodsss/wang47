mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  nameserver:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - DIRECT

  - name: 🤖 人工智能
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🪙 加密货币
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🌐 谷歌服务
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🐟 兜底分流
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

rule-providers:
  crypto:
    type: http
    behavior: classical
    url: "https://rule-proxy.mygods.workers.dev/stash/crypto.yaml"
    path: ./ruleset/crypto.yaml
    interval: 86400

  google:
    type: http
    behavior: classical
    url: "https://rule-proxy.mygods.workers.dev/stash/google.yaml"
    path: ./ruleset/google.yaml
    interval: 86400

rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - RULE-SET,crypto,🪙 加密货币
  - RULE-SET,google,🌐 谷歌服务
  - GEOIP,CN,DIRECT
  - MATCH,🐟 兜底分流

# Wang47 个人自用 Stash 配置文件 (Web3·AI·Media Optimized)
port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - 1.1.1.1

proxy-groups:
  - name: 自动选择
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true

  - name: gemini
    type: select
    proxies:
      - 自动选择
      - DIRECT

  - name: okx
    type: select
    proxies:
      - 自动选择
      - DIRECT

  - name: binance
    type: select
    proxies:
      - 自动选择
      - DIRECT

  - name: bybit
    type: select
    proxies:
      - 自动选择
      - DIRECT

  - name: bitget
    type: select
    proxies:
      - 自动选择
      - DIRECT

  - name: gate
    type: select
    proxies:
      - 自动选择
      - DIRECT

  - name: crypto
    type: select
    proxies:
      - 自动选择
      - DIRECT

  - name: telegram
    type: select
    proxies:
      - 自动选择
      - DIRECT


# Wang47 个人自用 Stash 配置 (Web3 · AI · Media 对齐版)
# 自动生成与 QX 策略组架构 100% 对齐

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8

proxy-groups:
  - name: 自动选择
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    include-all-proxies: true
    filter: "(?i)(🇭🇰|港|HK|🇹🇼|台|TW|🇸🇬|新|SG|🇯🇵|日|JP|🇺🇸|美|US)"

  - name: AI-Auto
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 台湾节点
      - 自动选择
      - DIRECT

  - name: 兜底分流
    type: select
    proxies:
      - DIRECT
      - 自动选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 美国节点
      - 狮城节点

  - name: 苹果服务
    type: select
    proxies:
      - DIRECT
      - 美国节点
      - 自动选择
      - 台湾节点
      - 日本节点

  - name: TikTok
    type: select
    proxies:
      - DIRECT
      - 台湾节点
      - 日本节点
      - 狮城节点
      - 自动选择

  - name: gemini
    type: select
    proxies:
      - AI-Auto
      - 美国节点
      - 日本节点
      - 台湾节点
      - DIRECT

  - name: okx
    type: select
    proxies:
      - 自动选择
      - 狮城节点
      - 台湾节点
      - 日本节点
      - DIRECT

  - name: binance
    type: select
    proxies:
      - 台湾节点
      - 狮城节点
      - 自动选择
      - DIRECT

  - name: bybit
    type: select
    proxies:
      - 狮城节点
      - 台湾节点
      - 日本节点
      - 自动选择
      - DIRECT

  - name: bitget
    type: select
    proxies:
      - 日本节点
      - 狮城节点
      - 台湾节点
      - 自动选择
      - DIRECT

  - name: gate
    type: select
    proxies:
      - 狮城节点
      - 台湾节点
      - 日本节点
      - 自动选择
      - DIRECT

  - name: crypto
    type: select
    proxies:
      - 狮城节点
      - 台湾节点
      - 日本节点
      - 自动选择
      - DIRECT

  - name: telegram
    type: select
    proxies:
      - 狮城节点
      - 香港节点
      - 自动选择
      - DIRECT

  # 地区节点筛选
  - name: 香港节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 30
    include-all-proxies: true
    filter: "(?i)(🇭🇰|港|HK|HongKong)"

  - name: 台湾节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 30
    include-all-proxies: true
    filter: "(?i)(🇹🇼|台|TW|Taiwan)"

  - name: 狮城节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 30
    include-all-proxies: true
    filter: "(?i)(🇸🇬|新|SG|Singapore)"

  - name: 日本节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 30
    include-all-proxies: true
    filter: "(?i)(🇯🇵|日|JP|Japan)"

  - name: 美国节点
    type: url-test
    url: http://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 40
    include-all-proxies: true
    filter: "(?i)(🇺🇸|美|US|States)"

